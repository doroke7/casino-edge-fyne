# 推論引擎：
#   onnx     用 onnxruntime 讀下面每個模型的 onnx（.onnx）（預設）。
#   openvino 用 OpenVINO 直接讀下面每個模型的 openvino（.xml），不再用 onnx 模型。
#            要先裝好 OpenVINO（macOS: brew install openvino）；macOS 預設就會編進執行檔，Linux、Windows 要用 -tags openvino 編譯。
engine: "openvino"


detect:
  die:
    cube:
      onnx: "./runs/detect/die/cube/result-1/weights/best.onnx"
      openvino: "./runs/detect/die/cube/result-1/weights/best_openvino_model/best.xml"
      threshold: 0.7
    top:
      onnx: "./runs/detect/die/top/result-1/weights/best.onnx"
      openvino: "./runs/detect/die/top/result-1/weights/best_openvino_model/best.xml"
      threshold: 0.7
  poker:
    card:
      onnx: "./runs/detect/poker/card/result-3/weights/best.onnx"
      openvino: "./runs/detect/poker/card/result-3/weights/best_openvino_model/best.xml"
      threshold: 0.7

classify:
  die:
    value:
      onnx: "./runs/classify/die/value/result-1/weights/best.onnx"
      openvino: "./runs/classify/die/value/result-1/weights/best_openvino_model/best.xml"
      threshold: 0.7
  poker:
    card:
      onnx: "./runs/classify/poker/card/result-2/weights/best.onnx"
      openvino: "./runs/classify/poker/card/result-2/weights/best_openvino_model/best.xml"
      threshold: 0.7
    rank:
      onnx: "./runs/classify/poker/rank/result-2/weights/best.onnx"
      openvino: "./runs/classify/poker/rank/result-2/weights/best_openvino_model/best.xml"
      threshold: 0.7
    suit:
      onnx: "./runs/classify/poker/suit/result-2/weights/best.onnx"
      openvino: "./runs/classify/poker/suit/result-2/weights/best_openvino_model/best.xml"
      threshold: 0.7
